name: Overenie iPhone aplikácie

# Native iOS is optional; the active workflow is the web application.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Zostavenie pre iOS simulátor (bez podpisu)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Select installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_app=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          if [ -z "$xcode_app" ]; then
            echo 'Xcode 26 is required but is not installed on this runner.' >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run ios:sync
      - name: Build unsigned simulator application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator build (cannot be installed on an iPhone)
        run: |
          ditto -c -k --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app flit-flat-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: flit-flat-simulator-not-for-iphone
          path: flit-flat-simulator.zip
          retention-days: 7
