name: Mesačný report nájmov a energií

on:
  schedule:
    # 20th, morning in Europe/Berlin (09:17 winter / 10:17 summer).
    - cron: '17 8 20 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-payment-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/monthly-report.test.js
      - name: Odoslať report z cloudovej evidencie
        run: node scripts/monthly-report.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
